version: '3.8'
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Map container's port 3000 to host's port 3000
    volumes:
      - .:/usr/src/app # Mount the current folder to the container
      - /app/node_modules # Exclude node_modules
    restart: unless-stopped
